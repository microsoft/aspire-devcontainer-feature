name: "Validate devcontainer-feature.json files"
on:
  workflow_dispatch:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Verify language-neutral feature metadata"
        run: node test/aspire/metadata.test.js

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./src"
